# Cloudflare Worker + static Vite build (matches Workers build UI: empty deploy → wrangler deploy)
# "name" must match your Worker/Pages project name in the dashboard (e.g. chelzeum).
name = "chelzeum"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
